name: pr-validation
on:
  pull_request:
    branches:
      - develop
jobs:
  pr-validation-job:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Lint HTML Files
        run: npx htmlhint "**/*.html"

      - name: Lint CSS Files
        run: npx stylelint "**/*.css"

      - name: Build Website
        run: npx parcel build "./src/index.html" --dist-dir "./dist" --public-url "./"
